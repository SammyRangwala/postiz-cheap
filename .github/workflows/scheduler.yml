name: Publish scheduled posts

# Runs every 10 minutes and asks the app to publish any posts that are due,
# so scheduling works even when nobody has the dashboard open.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  # Also run on every push to main, so a push can kick the publisher immediately.
  push:
    branches: [main]

permissions:
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger due posts
        env:
          APP_URL: ${{ vars.APP_URL || 'https://sammy-social-scheduler.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -n "$CRON_SECRET" ]; then AUTH="Authorization: Bearer $CRON_SECRET"; else AUTH="X-No-Auth: 1"; fi
          curl -fsS --max-time 90 -H "$AUTH" "$APP_URL/api/cron/publish"

      # GitHub pauses scheduled workflows after 60 days without repo activity.
      # Re-enabling on every run keeps the scheduler alive indefinitely.
      - name: Keep schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/scheduler.yml/enable" || true
